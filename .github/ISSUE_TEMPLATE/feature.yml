name: Feature Request
description: Suggest a feature for A2A Hub
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should the feature look like?
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Which phase does this belong to?
      options:
        - MVP (Phase 1)
        - Phase 2 (Trust & Intelligence)
        - Phase 3 (Platform & Enterprise)
        - Unsure
